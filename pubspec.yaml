name: budget_assistant
description: "Family Financial Assistant - Offline First, E2E Encrypted"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  local_auth: ^2.3.0
  uuid: ^4.6.0

  # State Management (Riverpod 3.x/4.x ecosystem)
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Local Database (Offline-First)
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  sqlite3: ^3.1.5
  path_provider: ^2.1.5
  path: ^1.9.1

  # Navigation
  go_router: ^14.8.1

  # Security
  flutter_secure_storage: ^9.2.4

  # Utils & Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  logger: ^2.5.0
  intl: ^0.20.1

  # Networking
  supabase_flutter: ^2.8.2
  dio: ^5.7.0

  # Crypto (Для AES-256-GCM и HKDF)
  crypto: ^3.0.6
  pointycastle: ^3.9.1

  # Background sync
  workmanager: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation (Золотая комбинация для analyzer ^12.0.0)
  build_runner: ^2.4.14
  
  freezed: 3.2.6-dev.1
  json_serializable: ^6.9.2
  drift_dev: 2.34.0
  
  riverpod_generator: ^4.0.4
  
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: system