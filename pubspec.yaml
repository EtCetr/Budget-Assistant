# pubspec.yaml
name: budget_assistant
description: "Family Financial Assistant - Offline First, E2E Encrypted"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0' # Обновлено с 3.12.0 для совместимости с выбранными зависимостями

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Database (Offline-First)
  drift: ^2.18.0 # Соответствует drift_dev ^2.18.0
  drift_flutter: ^0.2.7
  sqlite3: ^2.4.3 # <-- ВЕРНУЛИСЬ К ВЕРСИИ, КОТОРАЯ СОВМЕСТИМА С drift_dev ^2.18.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Navigation
  go_router: ^14.2.0

  # Security
  flutter_secure_storage: ^9.2.2

  # Utils & Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.3.0
  intl: ^0.19.0

  # Networking
  supabase_flutter: ^2.5.4
  dio: ^5.4.3+1

  # Crypto
  crypto: ^3.0.3
  pointycastle: ^3.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0 # <-- ОСТАЕТСЯ ^2.18.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

  # Mocking (for tests)
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
